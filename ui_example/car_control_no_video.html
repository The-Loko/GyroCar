<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Control</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: #000000;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 20px;
            gap: 30px;
            justify-content: center;
        }

        .status-bar {
            position: absolute;
            top: 16px;
            right: 16px;
            display: flex;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff3b30;
            transition: all 0.3s ease;
        }

        .status-dot.active {
            background: #34c759;
        }

        .parameters-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        .parameter {
            text-align: center;
            flex: 1;
        }

        .parameter-value {
            font-size: 32px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
            font-variant-numeric: tabular-nums;
        }

        .parameter-label {
            font-size: 14px;
            color: #8e8e93;
            font-weight: 500;
        }

        .controls-section {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 30px;
            align-items: center;
            padding-bottom: 20px;
        }

        .direction-controls {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .direction-pad {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            gap: 8px;
            width: 200px;
            height: 200px;
        }

        .direction-btn {
            width: 60px;
            height: 60px;
            border: none;
            border-radius: 12px;
            background: #1c1c1e;
            color: #ffffff;
            font-size: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.1s ease;
            border: 1px solid #38383a;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .direction-btn:active {
            background: #007aff;
            transform: scale(0.95);
        }

        .direction-btn.pressed {
            background: #007aff;
            border-color: #007aff;
        }

        .forward-btn {
            grid-column: 2;
            grid-row: 1;
        }

        .left-btn {
            grid-column: 1;
            grid-row: 2;
        }

        .right-btn {
            grid-column: 3;
            grid-row: 2;
        }

        .backward-btn {
            grid-column: 2;
            grid-row: 3;
        }

        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .control-button {
            width: 80px;
            height: 44px;
            border: none;
            border-radius: 22px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .power-btn {
            background: #ff3b30;
            color: white;
        }

        .power-btn.on {
            background: #34c759;
        }

        .control-button:active {
            transform: scale(0.95);
        }

        @media (max-width: 480px) {
            .container {
                padding: 16px;
                gap: 20px;
            }
            
            .controls-section {
                grid-template-columns: 1fr;
                text-align: center;
                gap: 20px;
            }
            
            .buttons-container {
                flex-direction: row;
                justify-content: center;
                gap: 16px;
            }
            
            .direction-pad {
                width: 150px;
                height: 150px;
            }

            .direction-btn {
                width: 44px;
                height: 44px;
                font-size: 16px;
            }

            .parameter-value {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="status-bar">
            <div class="status-dot active" id="connectionStatus"></div>
            <div class="status-dot" id="powerStatus"></div>
        </div>

        <div class="parameters-section">
            <div class="parameter">
                <div class="parameter-value" id="distanceValue">125</div>
                <div class="parameter-label">cm</div>
            </div>
            <div class="parameter">
                <div class="parameter-value" id="temperatureValue">24</div>
                <div class="parameter-label">°C</div>
            </div>
            <div class="parameter">
                <div class="parameter-value" id="pressureValue">1013</div>
                <div class="parameter-label">hPa</div>
            </div>
        </div>

        <div class="controls-section">
            <div class="direction-controls">
                <div class="direction-pad">
                    <button class="direction-btn forward-btn" id="forwardBtn">↑</button>
                    <button class="direction-btn left-btn" id="leftBtn">←</button>
                    <button class="direction-btn right-btn" id="rightBtn">→</button>
                    <button class="direction-btn backward-btn" id="backwardBtn">↓</button>
                </div>
            </div>

            <div class="buttons-container">
                <button class="control-button power-btn" id="powerBtn">
                    OFF
                </button>
            </div>
        </div>
    </div>
</body>
</html>
